<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasker - Minimal To-Do List</title>
    <link rel="stylesheet" href="css/todo-styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">✓ Tasker</h1>
                <p class="tagline">Your minimal task companion</p>
            </div>
        </header>

        <main class="main">
            <div class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="Add a new task..."
                        autocomplete="off"
                    >
                    <button id="addBtn" class="btn btn-add">Add Task</button>
                </div>
                <div class="input-helper">Press Enter or click Add Task</div>
            </div>

            <div class="controls-section">
                <div class="filter-buttons">
                    <button class="btn btn-filter active" data-filter="all">All</button>
                    <button class="btn btn-filter" data-filter="active">Active</button>
                    <button class="btn btn-filter" data-filter="completed">Completed</button>
                </div>
                <div class="stats">
                    <span class="stat-item">
                        <strong id="activeCount">0</strong> active
                    </span>
                    <span class="stat-item">
                        <strong id="completedCount">0</strong> completed
                    </span>
                </div>
            </div>

            <div class="tasks-container">
                <ul id="tasksList" class="tasks-list"></ul>
                <div id="emptyState" class="empty-state">
                    <p>📝 No tasks yet. Add one to get started!</p>
                </div>
            </div>

            <div class="action-buttons">
                <button id="clearCompletedBtn" class="btn btn-secondary">Clear Completed</button>
                <button id="clearAllBtn" class="btn btn-danger">Clear All</button>
            </div>
        </main>
    </div>

    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h2 id="confirmTitle">Confirm Action</h2>
            <p id="confirmMessage"></p>
            <div class="modal-actions">
                <button id="confirmBtn" class="btn btn-primary">Confirm</button>
                <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="js/todo-app.js"></script>
</body>
</html>
